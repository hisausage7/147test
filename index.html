<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>147自測網站入口</title>
  <link rel="icon" type="image/png" href="favicon-OIP.jpg?v=3">
  <link rel="apple-touch-icon" href="favicon-OIP.jpg?v=3">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      /* ✅ 中性深色：不藍、不霓虹 */
      --bg:#0b0c10;
      --panel:#11131a;
      --panel2:#0f1117;
      --line: rgba(255,255,255,.10);
      --line2: rgba(255,255,255,.14);

      --txt:#eef0ff;
      --muted: rgba(220,226,255,.72);

      /* 小點綴色：只用在選取/焦點，不會整頁變紫藍 */
      --accent: rgba(167,139,250,.95); /* violet */
      --accentBg: rgba(167,139,250,.12);

      --r:14px;
      --r2:12px;
      --gap:8px;

      /* 動畫 */
      --ease:cubic-bezier(.2,.8,.2,1);
      --t120:120ms var(--ease);
      --t180:180ms var(--ease);
      --t260:260ms var(--ease);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--txt);
      font-family:"Microsoft JhengHei", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      overflow-x:hidden;
    }

    /* 很淡的質感點點（你也可以改成 display:none） */
    .noise{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      opacity:.06;
      background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
      background-size: 22px 22px;
      mix-blend-mode: overlay;
    }

    .app{
      position:relative;
      z-index:1;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* ===== Topbar (系統化 App Bar) ===== */
    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      background: rgba(11,12,16,.92);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
    }
    .topbarInner{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 9px 10px; /* ✅ 更省空間 */
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 210px;
      flex: 0 0 auto;
    }
    .logo{
      width:36px;height:36px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .brandTxt{ line-height:1.15; }
    .brandTxt .t{
      margin:0;
      font-family:"Noto Serif TC","Microsoft JhengHei",serif;
      font-weight:700;
      font-size:15px;
      letter-spacing:.6px;
      color:#fff;
    }
    .brandTxt .s{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 240px;
    }

    .search{
      flex: 1 1 360px;
      display:flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: var(--r);
      background: var(--panel2);
      border: 1px solid var(--line);
      min-width: 220px;
      transition: border-color var(--t180), box-shadow var(--t180);
    }
    .search .ic{ opacity:.85; font-size:14px; }
    .search input{
      width:100%;
      border:0;
      outline:none;
      background: transparent;
      color: var(--txt);
      font-size:13.5px;
      font-weight:850;
    }
    .search input::placeholder{ color: rgba(220,226,255,.55); }
    .search:focus-within{
      border-color: rgba(167,139,250,.40);
      box-shadow: 0 0 0 3px rgba(167,139,250,.12);
    }

    .actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      flex: 1 1 auto;
      min-width: 0;
    }

    .ctl{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--panel2);
      border: 1px solid var(--line);
      font-size:12px;
      font-weight:950;
      color: var(--txt);
      white-space:nowrap;
    }
    .ctl .mut{ color: var(--muted); font-weight:850; }

    select.sel{
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--txt);
      padding: 7px 10px;
      border-radius: 12px;
      font-weight:950;
      font-size:12px;
      outline:none;
    }

    .btn{
      cursor:pointer;
      user-select:none;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--txt);
      padding: 7px 10px;
      border-radius: 12px;
      font-weight:950;
      font-size:12px;
      white-space:nowrap;
      transition: transform var(--t120), background var(--t180), border-color var(--t180), opacity var(--t180);
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    .btn:active{ transform: translateY(0); opacity:.92; }
    .btn.on{
      border-color: rgba(167,139,250,.45);
      background: rgba(167,139,250,.10);
    }

    /* ===== Body grid ===== */
    .body{
      display:grid;
      grid-template-columns: 220px minmax(0,1fr); /* ✅ 更窄 */
      gap: var(--gap);
      padding: 10px;
    }

    /* ===== Sidebar (導覽) ===== */
    .side{
      align-self:start;
      position:sticky;
      top: 62px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow:hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
    }
    .sideHead{
      padding: 10px 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sideHead .h{
      margin:0;
      font-size:12px;
      letter-spacing:.6px;
      color: rgba(220,226,255,.78);
      font-weight:1000;
    }

    .nav{
      padding: 8px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .navBtn{
      width:100%;
      cursor:pointer;
      border: 1px solid transparent;
      background: transparent;
      color: var(--txt);
      border-radius: 12px;
      padding: 8px 9px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-weight:950;
      text-align:left;
      transition: transform var(--t120), background var(--t180), border-color var(--t180), opacity var(--t180);
    }
    .navBtn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.05);
      border-color: rgba(255,255,255,.06);
    }
    .navBtn:active{ transform: translateY(0); opacity:.92; }
    .navBtn.active{
      background: var(--accentBg);
      border-color: rgba(167,139,250,.28);
    }
    .navLeft{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .dot{
      width:9px;height:9px;border-radius:999px;
      background: rgba(255,255,255,.22);
      flex:0 0 auto;
    }
    .navBtn.active .dot{ background: rgba(167,139,250,.90); }

    .navLabel{
      min-width:0;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      font-size:13px;
    }
    .badge{
      flex:0 0 auto;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: rgba(220,226,255,.85);
      font-size: 11.5px;
      font-weight:1000;
    }

    .sideFoot{
      padding: 10px 10px 12px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: rgba(220,226,255,.65);
      font-size: 12px;
      line-height: 1.55;
    }
    .kbd{
      display:inline-block;
      padding: 1px 7px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      font-weight:900;
      font-size: 11px;
      margin: 0 2px;
    }

    /* ===== Main ===== */
    .main{
      min-width:0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow:hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
    }
    .mainHead{
      padding: 10px 10px 10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
      flex-wrap:wrap;
    }
    .mainHead .ttl{
      margin:0;
      font-family:"Noto Serif TC","Microsoft JhengHei",serif;
      font-size:18px;
      letter-spacing:.6px;
      color:#fff;
    }
    .mainHead .sub{
      margin:6px 0 0;
      color: var(--muted);
      font-size:12.8px;
      font-weight:850;
    }
    .stats{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }
    .stat{
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--panel2);
      border: 1px solid var(--line);
      font-size:12px;
      font-weight:950;
      white-space:nowrap;
    }
    .stat b{ color:#fff; }
    .stat .m{ color: var(--muted); font-weight:850; margin-left:6px; }

    /* ===== Content ===== */
    .content{
      padding: 10px;
      display:grid;
      gap:10px;
      min-width:0;
    }

    .section{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(15,17,23,.40);
      border-radius: var(--r);
      overflow:hidden;
      min-width:0;

      /* 進場：預設先藏 */
      opacity: 0;
      transform: translateY(6px);
    }

    .sectionHead{
      padding: 9px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
    }
    .sectionHead .name{
      font-weight:1000;
      font-size: 13px;
      letter-spacing:.4px;
    }
    .sectionHead .count{
      color: var(--muted);
      font-weight:950;
      font-size: 12px;
    }

    .table{
      display:flex;
      flex-direction:column;
    }

    .thead{
      display:grid;
      grid-template-columns: 1fr 140px 170px;
      gap:10px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      color: rgba(220,226,255,.70);
      font-size: 12px;
      font-weight:1000;
    }

    .tr{
      display:grid;
      grid-template-columns: 1fr 140px 170px;
      gap:10px;
      padding: 9px 10px;  /* ✅ 密度更高 */
      border-bottom: 1px solid rgba(255,255,255,.06);
      align-items:center;
      min-width:0;

      /* 進場：預設先藏 */
      opacity: 0;
      transform: translateY(6px);
    }
    .tr:last-child{ border-bottom:0; }
    .tr:hover{ background: rgba(255,255,255,.035); }

    .tTitle{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .tTitle .name{
      font-weight:1000;
      font-size: 14.5px;
      line-height: 1.25;
      word-break:break-word;
    }
    .tTitle .kw{
      font-size: 12px;
      color: rgba(220,226,255,.58);
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      justify-content:flex-start;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: rgba(220,226,255,.80);
      font-weight:950;
      font-size: 11.5px;
      width: fit-content;
      max-width: 100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .tActs{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }

    .go, .fav{
      cursor:pointer;
      text-decoration:none;
      color: var(--txt);
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      padding: 8px 10px;
      border-radius: 12px;
      font-weight:1000;
      font-size: 12px;
      white-space:nowrap;
      transition: transform var(--t120), background var(--t180), border-color var(--t180), opacity var(--t180);
    }
    .go:hover, .fav:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.20); }
    .go:active, .fav:active{ transform: translateY(0); opacity:.92; }

    .fav.on{
      border-color: rgba(167,139,250,.45);
      background: rgba(167,139,250,.10);
    }

    .empty{
      padding: 14px 12px;
      border-radius: var(--r);
      border: 1px dashed rgba(255,255,255,.16);
      background: rgba(15,17,23,.35);
      color: rgba(220,226,255,.70);
      text-align:center;
      font-weight:950;
      margin: 10px;
    }

    footer{
      text-align:center;
      color: rgba(231,238,255,.60);
      font-size: 12.5px;
      padding: 14px 10px 22px;
    }

    /* ===== Density mode ===== */
    .dense .topbarInner{ padding: 8px 9px; }
    .dense .body{ padding: 8px; gap: 8px; }
    .dense .mainHead{ padding: 9px 9px; }
    .dense .content{ padding: 8px; gap: 8px; }
    .dense .tr{ padding: 8px 10px; }
    .dense .thead{ padding: 7px 10px; }
    .dense .navBtn{ padding: 7px 8px; }

    /* ===== Responsive ===== */
    @media (max-width: 980px){
      .body{ grid-template-columns: 1fr; }
      .side{ position:relative; top:auto; }
      .brand{ min-width:0; }
      .actions{ justify-content:flex-start; width:100%; }
    }

    @media (max-width: 760px){
      .thead{ display:none; }
      .tr{
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .tActs{ justify-content:flex-start; }
    }

    /* ===== 動畫與特效 ===== */

    /* render 後套 class */
    .section.in, .tr.in{
      opacity: 1;
      transform: translateY(0);
      transition: opacity var(--t260), transform var(--t260);
    }

    /* pill loading shimmer */
    .ctl.loading{
      position:relative;
      overflow:hidden;
    }
    .ctl.loading:after{
      content:"";
      position:absolute;
      inset:0;
      transform: translateX(-120%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
      animation: shimmer 1.1s linear infinite;
      pointer-events:none;
    }
    @keyframes shimmer{
      to{ transform: translateX(120%); }
    }

    /* Ripple */
    .ripple{ position:relative; overflow:hidden; }
    .ripple .rip{
      position:absolute;
      border-radius:999px;
      transform: scale(0);
      opacity:.35;
      background: rgba(255,255,255,.55);
      animation: rip 520ms var(--ease);
      pointer-events:none;
    }
    @keyframes rip{
      to{ transform: scale(3.2); opacity:0; }
    }

    /* Toast */
    .toast{
      position:fixed;
      left:50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(15,17,23,.92);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--txt);
      padding: 10px 12px;
      border-radius: 999px;
      box-shadow: 0 14px 30px rgba(0,0,0,.40);
      font-weight: 950;
      font-size: 12.5px;
      opacity:0;
      transition: opacity var(--t180), transform var(--t180);
      z-index: 999;
      pointer-events:none;
      white-space:nowrap;
    }
    .toast.show{
      opacity:1;
      transform: translateX(-50%) translateY(0);
    }

    /* 減少動作：自動關動畫 */
    @media (prefers-reduced-motion: reduce){
      .navBtn, .btn, .go, .fav, .search{ transition:none; }
      .section, .tr{ opacity:1; transform:none; }
      .ctl.loading:after{ display:none; }
      .ripple .rip{ display:none; }
    }
  </style>
</head>

        return obj || fallback;

    function isFav(item){ return !!favs[item.url]; }

    function addRecent(item){
      try{
        var now = Date.now();
        var next = [];
        for(var i=0;i<recent.length;i++){
          if(recent[i] && recent[i].url !== item.url) next.push(recent[i]);
        }
        next.unshift({url:item.url, title:item.title, ts: now});
        if(next.length > 10) next = next.slice(0,10);
        recent = next;
        saveJSON(LS_REC, recent);
      }catch(e){}
    }

    function matchItem(item){
      if(state.activeFilter === 'fav'){
        if(!isFav(item)) return false;
      }else if(state.activeFilter !== 'all'){
        if(item.section !== state.activeFilter) return false;
      }
      var q = (state.query||'').toLowerCase().trim();
      if(!q) return true;
      var hay = (item.title + ' ' + item.keywords + ' ' + item.group).toLowerCase();
      return hay.indexOf(q) > -1;
    }

    function groupBy(arr, keyFn){
      var map = {};
      for(var i=0;i<arr.length;i++){
        var k = keyFn(arr[i]);
        if(!map[k]) map[k]=[];
        map[k].push(arr[i]);
      }
      return map;
    }

    function getRecTs(url){
      for(var i=0;i<recent.length;i++){
        if(recent[i] && recent[i].url === url) return recent[i].ts || 0;
      }
      return 0;
    }

    /* ✅ 這段已修正：智慧排序會依照 M 的數字順序 */
    function sortItems(arr){
      var mode = ui.sort || 'smart';
      var a = arr.slice(0);

      function cmpText(x,y){
        x = (x||'').toLowerCase();
        y = (y||'').toLowerCase();
        if(x<y) return -1;
        if(x>y) return 1;
        return 0;
      }

      /* 解析 M 的排序：M1, M2, ... M10 ...；M11A 在 M11B 前 */
      function getMRank(item){
        var s = ((item.title||'') + ' ' + (item.keywords||'')).toUpperCase();

        /* ALL 讓它在同組內排最前（想要最後就把 -100 改成 999999） */
        if(s.indexOf('ALL') > -1) return -100;

        var m = s.match(/M\s*([0-9]{1,2})([A-Z])?/);
        if(!m) return 999999;

        var num = parseInt(m[1], 10);
        var suf = m[2] || '';
        var sw = 0;
        if(suf === 'A') sw = 1;
        else if(suf === 'B') sw = 2;
        else if(suf === 'C') sw = 3;

        return num * 100 + sw;
      }

      function cmpM(p,q){
        var rp = getMRank(p);
        var rq = getMRank(q);
        if(rp !== rq) return rp - rq;
        return cmpText(p.title, q.title);
      }

      a.sort(function(p,q){
        if(mode === 'title'){
          return cmpText(p.title, q.title);
        }
        if(mode === 'group'){
          var g1 = cmpText(p.group, q.group);
          if(g1!==0) return g1;
          return cmpText(p.title, q.title);
        }
        if(mode === 'recent'){
          return (getRecTs(q.url) - getRecTs(p.url)) || cmpText(p.title, q.title);
        }
        if(mode === 'fav'){
          var f1 = (isFav(q)?1:0) - (isFav(p)?1:0);
          if(f1!==0) return f1;
          return cmpText(p.title, q.title);
        }

        /* smart：收藏 > 最近 > M順序 > 標題 */
        var sf = (isFav(q)?1:0) - (isFav(p)?1:0);
        if(sf!==0) return sf;

        var sr = (getRecTs(q.url) - getRecTs(p.url));
        if(sr!==0) return sr;

        return cmpM(p, q);
      });

      return a;
    }

    /* Ripple：事件委派（btn/nav/go/fav 都有水波） */
    function makeRipple(elm){
      if(!elm || !elm.classList) return;
      if(!elm.classList.contains('ripple')) elm.classList.add('ripple');
    }
    function fireRipple(elm, clientX, clientY){
      if(!elm) return;
      makeRipple(elm);

      var r = elm.getBoundingClientRect();
      var size = Math.max(r.width, r.height);
      var x = clientX - r.left - size/2;
      var y = clientY - r.top - size/2;

      var s = document.createElement('span');
      s.className = 'rip';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = x + 'px';
      s.style.top = y + 'px';

      elm.appendChild(s);
      setTimeout(function(){
        try{ elm.removeChild(s); }catch(e){}
      }, 560);
    }
    document.addEventListener('click', function(e){
      var t = e.target;
      while(t && t !== document.body){
        if(t.classList && (t.classList.contains('btn') || t.classList.contains('navBtn') || t.classList.contains('go') || t.classList.contains('fav'))){
          fireRipple(t, e.clientX, e.clientY);
          break;
        }
        t = t.parentNode;
      }
    }, true);

          var s = d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' (週'+days[d.getDay()]+') '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
          elp.innerHTML = '🕒 <span class="mut">'+ s +'</span>';
        }catch(e){}
      }
      tick();
      setInterval(tick, 1000);
    })();

      function wxMap(code,isNight){
        var map={
          0:{e:'☀️',t:'晴朗'},1:{e:'🌤️',t:'多雲時晴'},2:{e:'⛅',t:'陰晴不定'},3:{e:'☁️',t:'多雲'},
          45:{e:'🌫️',t:'霧'},48:{e:'🌫️',t:'霧'},
          51:{e:'🌦️',t:'細雨'},53:{e:'🌦️',t:'毛毛雨'},55:{e:'🌧️',t:'小雨'},
          61:{e:'🌧️',t:'小雨'},63:{e:'🌧️',t:'中雨'},65:{e:'🌧️',t:'大雨'},
          71:{e:'🌨️',t:'小雪'},73:{e:'🌨️',t:'中雪'},75:{e:'❄️',t:'大雪'},
          80:{e:'🌦️',t:'陣雨'},81:{e:'🌧️',t:'陣雨'},82:{e:'🌧️',t:'豪雨'},
          95:{e:'⛈️',t:'雷雨'},96:{e:'⛈️',t:'雷雨冰雹'},99:{e:'⛈️',t:'強雷雹'}
        };
        var item = map[code] || {e:(isNight?'🌙':'☀️'), t:'天氣'};
        if(isNight && (code===0 || code===1)) item.e='🌙';
        return item;
      }

      function fetchTaichung(){
        var lat = 24.067337599276396;
        var lon = 120.71470802813444;
        var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code,is_day';
        fetch(url).then(function(res){
          if(!res.ok) throw new Error('network');
          return res.json();
        }).then(function(data){
          var cur = data.current || {};
          var code = (cur.weather_code!=null?cur.weather_code:0);
          var temp = Math.round(cur.temperature_2m!=null?cur.temperature_2m:0);
          var isNight = (cur.is_day===0);
          var m = wxMap(code, isNight);
          pill.innerHTML = m.e + ' <span class="mut">臺中｜'+ m.t +'・'+ temp +'°C</span>';
          try{ pill.classList.remove('loading'); }catch(e){}
        }).catch(function(){
          pill.innerHTML = '⚠️ <span class="mut">天氣取得失敗</span>';
          try{ pill.classList.remove('loading'); }catch(e){}
        });
      }
      fetchTaichung();
    })();

    /* init */
    applyUI();
    buildNav();
    render();
  </script>
</body>
</html>
