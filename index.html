<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>147自測網站 V3.1</title>
  <link rel="icon" type="image/png" href="favicon-OIP.jpg?v=3">
  <link rel="apple-touch-icon" href="favicon-OIP.jpg?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#060816;
      --bg2:#0a1024;
      --panel:rgba(10,16,36,.74);
      --panel2:rgba(11,18,42,.88);
      --panel3:rgba(13,21,50,.96);
      --glass:rgba(255,255,255,.05);
      --line:rgba(128,173,255,.18);
      --line2:rgba(100,242,255,.18);
      --txt:#eef6ff;
      --muted:rgba(202,220,255,.70);
      --cyan:#6fe7ff;
      --blue:#75a7ff;
      --violet:#a987ff;
      --lime:#92ffca;
      --danger:#ff86bb;
      --shadow:0 22px 64px rgba(0,0,0,.42);
      --r:24px;
      --r2:20px;
      --topbarH:78px;
      --ease:cubic-bezier(.22,.8,.2,1);
      --t120:120ms var(--ease);
      --t220:220ms var(--ease);
      --t380:380ms var(--ease);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--txt);
      font-family:"Inter","Microsoft JhengHei",system-ui,sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(111,231,255,.16), transparent 24%),
        radial-gradient(circle at 82% 14%, rgba(169,135,255,.15), transparent 22%),
        radial-gradient(circle at 50% 65%, rgba(117,167,255,.10), transparent 30%),
        linear-gradient(180deg, #050714 0%, #070b19 40%, #060816 100%);
      overflow-x:hidden;
    }
    .bg,.bg:before,.bg:after,.gridFx,.scan,.stars{position:fixed;inset:0;pointer-events:none}
    .bg{z-index:0;overflow:hidden}
    .bg:before,.bg:after{content:"";position:absolute;border-radius:50%;filter:blur(95px);opacity:.35}
    .bg:before{width:42vw;height:42vw;left:-10vw;top:8vh;background:rgba(111,231,255,.18)}
    .bg:after{width:38vw;height:38vw;right:-6vw;top:18vh;background:rgba(169,135,255,.20)}
    .gridFx{z-index:0;opacity:.18;background:
      linear-gradient(rgba(117,167,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(117,167,255,.10) 1px, transparent 1px);
      background-size:34px 34px,34px 34px;
      mask-image:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.5) 22%, black 60%, transparent 100%);
      transform:perspective(800px) rotateX(74deg) scale(1.4);
      transform-origin:center 72%;
      top:36vh;
    }
    .scan{z-index:0;opacity:.10;background:repeating-linear-gradient(180deg, rgba(255,255,255,.15) 0 1px, transparent 1px 4px)}
    .stars{z-index:0;background-image:radial-gradient(rgba(255,255,255,.65) .6px, transparent .7px);background-size:32px 32px;opacity:.22}

    .app{position:relative;z-index:1;min-height:100vh;padding:18px}
    .shell{max-width:1520px;margin:0 auto}

    .topbar{
      position:sticky;top:14px;z-index:20;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg, rgba(11,18,42,.88), rgba(8,12,30,.78));
      backdrop-filter:blur(18px) saturate(130%);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.07);
    }
    .topbar:before{
      content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(135deg, rgba(111,231,255,.45), transparent 20%, transparent 80%, rgba(169,135,255,.28));
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude;pointer-events:none;
    }
    .topbarRow{display:grid;grid-template-columns:260px minmax(0,1fr) auto;gap:14px;align-items:center}

    .brandBox{
      display:flex;align-items:center;gap:14px;min-width:0;
      padding:12px 14px;border-radius:22px;background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);
    }
    .logo{width:52px;height:52px;border-radius:18px;background:#0b1129 url('OIP.jpg') center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 0 32px rgba(111,231,255,.16)}
    .brandMeta{min-width:0}
    .brandKicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:5px}
    .brandTitle{font-family:"Noto Serif TC",serif;font-size:22px;line-height:1.1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .centerPanel{display:grid;grid-template-rows:auto auto;gap:10px;min-width:0}
    .banner{
      display:flex;align-items:center;gap:10px;min-width:0;padding:10px 14px;border-radius:18px;
      background:linear-gradient(90deg, rgba(111,231,255,.10), rgba(169,135,255,.08));border:1px solid rgba(111,231,255,.16)
    }
    .banner strong{padding:4px 9px;border-radius:999px;background:rgba(111,231,255,.12);border:1px solid rgba(111,231,255,.18);font-size:11px;letter-spacing:.08em}
    .banner span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:700;font-size:13px}
    .searchWrap{
      display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;min-width:0
    }
    .searchBox,.miniBox,.selectBox,.actionBtn{
      border-radius:18px;border:1px solid rgba(130,175,255,.14);background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05)
    }
    .searchBox{display:flex;align-items:center;gap:10px;padding:0 14px;height:54px;min-width:0}
    .searchBox i{font-style:normal;color:var(--cyan)}
    .searchBox input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--txt);font-size:14px;font-weight:800}
    .searchBox input::placeholder{color:rgba(210,226,255,.46)}
    .miniBox{height:54px;padding:0 14px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;color:var(--muted)}
    .miniBox b{color:#fff}
    .selectBox{height:54px;padding:0 12px;display:flex;align-items:center}
    .selectBox select{border:0;outline:0;background:transparent;color:var(--txt);font-weight:900;font-size:12px}
    .actionBtn{
      cursor:pointer;height:54px;padding:0 16px;color:var(--txt);font-weight:900;font-size:12px;
      transition:transform var(--t120), border-color var(--t220), background var(--t220), box-shadow var(--t220)
    }
    .actionBtn:hover{transform:translateY(-2px);border-color:rgba(111,231,255,.30);box-shadow:0 8px 24px rgba(111,231,255,.10)}
    .actionBtn.on{background:linear-gradient(180deg, rgba(111,231,255,.14), rgba(117,167,255,.08));border-color:rgba(111,231,255,.34)}

    .layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;padding-top:18px}

    .aside{
      position:sticky;top:120px;align-self:start;overflow:hidden;
      border-radius:32px;background:linear-gradient(180deg, rgba(9,14,31,.90), rgba(9,13,28,.76));
      border:1px solid var(--line);box-shadow:var(--shadow)
    }
    .aside:before,.main:before{
      content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(145deg, rgba(111,231,255,.28), transparent 22%, transparent 78%, rgba(169,135,255,.22));
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude;pointer-events:none;
    }
    .contactPanel{padding:18px;border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg, rgba(111,231,255,.06), rgba(169,135,255,.04))}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:900}
    .contactPanel h3{margin:8px 0 10px;font-size:26px;line-height:1.05}
    .contactPanel p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.7;font-weight:700}
    .contactBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .contactBtn{
      display:flex;align-items:center;justify-content:center;min-height:52px;text-decoration:none;color:#fff;font-weight:900;font-size:13px;
      border-radius:18px;border:1px solid rgba(255,255,255,.10);background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
      transition:transform var(--t120), background var(--t220), box-shadow var(--t220), border-color var(--t220)
    }
    .contactBtn:hover{transform:translateY(-2px);border-color:rgba(111,231,255,.34);background:linear-gradient(180deg, rgba(111,231,255,.16), rgba(169,135,255,.08));box-shadow:0 10px 24px rgba(111,231,255,.08)}
    .navWrap{padding:16px}
    .navHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
    .navHead h4{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .navList{display:grid;gap:10px}
    .navBtn{
      position:relative;cursor:pointer;text-align:left;padding:14px 14px 14px 16px;width:100%;overflow:hidden;
      border-radius:20px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      color:var(--txt);transition:transform var(--t120), border-color var(--t220), background var(--t220), box-shadow var(--t220)
    }
    .navBtn:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:999px;background:linear-gradient(180deg, transparent, rgba(111,231,255,.9), transparent);opacity:.45}
    .navBtn:hover{transform:translateX(2px);border-color:rgba(111,231,255,.22);background:linear-gradient(180deg, rgba(111,231,255,.08), rgba(255,255,255,.03))}
    .navBtn.active{border-color:rgba(111,231,255,.30);background:linear-gradient(135deg, rgba(111,231,255,.16), rgba(169,135,255,.08));box-shadow:0 14px 32px rgba(111,231,255,.08)}
    .navBtn.active:before{opacity:1}
    .navTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .navName{font-size:14px;font-weight:900}
    .navBadge{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:900;color:#fff}
    .navMini{margin-top:6px;font-size:12px;color:var(--muted);font-weight:700}
    .sideFoot{padding:0 18px 18px;color:var(--muted);font-size:12px;line-height:1.7;font-weight:700}
    .kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:11px;font-weight:900}

    .main{position:relative;min-width:0;border-radius:34px;background:linear-gradient(180deg, rgba(9,14,31,.92), rgba(8,12,28,.78));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
    .mainTop{padding:22px 22px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
    .hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
    .heroTitle{margin:0;font-size:40px;line-height:.95;font-weight:900;letter-spacing:-.03em}
    .heroSub{margin:10px 0 0;color:var(--muted);font-size:14px;font-weight:700}
    .statBar{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
    .stat{
      min-width:126px;padding:14px 16px;border-radius:22px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08)
    }
    .statLabel{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800}
    .statNum{margin-top:8px;font-size:28px;font-weight:900;line-height:1}

    .content{padding:20px;display:grid;gap:18px}
    .section{opacity:0;transform:translateY(10px)}
    .section.in,.card.in{opacity:1;transform:none;transition:opacity var(--t380), transform var(--t380)}
    .sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:0 4px}
    .sectionHead .left{display:flex;align-items:center;gap:12px}
    .sectionIndex{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-weight:900;background:linear-gradient(180deg, rgba(111,231,255,.18), rgba(169,135,255,.10));border:1px solid rgba(111,231,255,.18)}
    .sectionTitle{font-size:21px;font-weight:900}
    .sectionCount{padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--muted);font-size:12px;font-weight:800}

    .cardGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{
      position:relative;min-height:228px;padding:18px;overflow:hidden;
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(130,175,255,.14);
      box-shadow:0 14px 34px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.05);
      clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
      transition:transform var(--t220), border-color var(--t220), box-shadow var(--t220), background var(--t220)
    }
    .card:hover{transform:translateY(-6px) scale(1.01);border-color:rgba(111,231,255,.28);box-shadow:0 22px 44px rgba(0,0,0,.34), 0 0 34px rgba(111,231,255,.06)}
    .card:before{content:"";position:absolute;right:-38px;top:-38px;width:120px;height:120px;border-radius:32px;background:radial-gradient(circle, rgba(111,231,255,.18), transparent 68%);pointer-events:none}
    .card:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg, rgba(111,231,255,.06), transparent 38%, transparent 62%, rgba(169,135,255,.05));pointer-events:none}
    .cardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;position:relative;z-index:1}
    .modulePill{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:900;max-width:100%}
    .modulePill span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fav{
      flex:0 0 auto;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#fff;
      width:42px;height:42px;border-radius:16px;font-size:18px;font-weight:900;transition:transform var(--t120), border-color var(--t220), background var(--t220)
    }
    .fav:hover{transform:translateY(-2px);border-color:rgba(111,231,255,.28)}
    .fav.on{background:linear-gradient(180deg, rgba(111,231,255,.18), rgba(169,135,255,.10));border-color:rgba(111,231,255,.32)}
    .cardTitle{position:relative;z-index:1;font-size:22px;line-height:1.08;font-weight:900;letter-spacing:-.02em;min-height:72px}
    .cardMeta{position:relative;z-index:1;margin-top:12px;display:grid;gap:8px}
    .metaChip{display:inline-flex;align-items:center;width:fit-content;max-width:100%;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--muted);font-weight:800}
    .kw{position:relative;z-index:1;margin-top:10px;font-size:12px;line-height:1.55;color:rgba(214,227,255,.62);font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:55px}
    .cardActions{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:16px}
    .go{
      min-height:50px;text-decoration:none;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
      border-radius:16px;background:linear-gradient(135deg, rgba(111,231,255,.20), rgba(117,167,255,.14) 55%, rgba(169,135,255,.16));
      border:1px solid rgba(111,231,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)
    }
    .quickNote{font-size:11px;color:var(--muted);font-weight:800;text-align:right}
    .empty{padding:26px;border-radius:26px;border:1px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.03);color:var(--muted);font-size:14px;font-weight:800;text-align:center}

    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;z-index:50;padding:12px 16px;border-radius:999px;background:rgba(10,16,36,.94);border:1px solid rgba(111,231,255,.18);color:#fff;font-size:12px;font-weight:900;transition:opacity var(--t220), transform var(--t220)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .ripple{position:relative;overflow:hidden}
    .rip{position:absolute;border-radius:999px;transform:scale(0);opacity:.42;background:rgba(255,255,255,.55);animation:rip 560ms var(--ease);pointer-events:none}
    @keyframes rip{to{transform:scale(3.1);opacity:0}}

    @media (max-width:1280px){
      .searchWrap{grid-template-columns:1fr 1fr 1fr auto auto}
      .miniBox{font-size:11px}
    }
    @media (max-width:1120px){
      .topbarRow{grid-template-columns:1fr}
      .layout{grid-template-columns:1fr}
      .aside{position:relative;top:auto}
      .hero{grid-template-columns:1fr}
      .statBar{justify-content:flex-start}
    }
    @media (max-width:860px){
      .searchWrap{grid-template-columns:1fr 1fr}
      .selectBox,.actionBtn,.miniBox{height:50px}
      .heroTitle{font-size:32px}
      .contactBtns{grid-template-columns:1fr}
    }
    @media (max-width:620px){
      .app{padding:10px}
      .topbar{top:10px;padding:12px}
      .brandTitle{font-size:18px}
      .searchWrap{grid-template-columns:1fr}
      .cardGrid{grid-template-columns:1fr}
      .heroTitle{font-size:28px}
      .mainTop,.content{padding:16px}
      .aside,.main{border-radius:26px}
    }
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="gridFx" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>

<div class="app" id="app">
  <div class="shell">
    <header class="topbar" id="topbar">
      <div class="topbarRow">
        <div class="brandBox">
          <div class="logo"></div>
          <div class="brandMeta">
            <div class="brandTitle">147自測網站</div>
            <div class="brandKicker">BY Sausage System</div>
          </div>
        </div>

        <div class="centerPanel">
          <div class="banner"><strong>v3.1</strong><span>不斷電維護進行中，請隨時重新整理</span></div>
          <div class="searchWrap">
            <label class="searchBox" aria-label="搜尋"><i>⌕</i><input id="q" type="search" placeholder="搜尋模組、分類、關鍵字" autocomplete="off"></label>
            <div class="miniBox" id="clockPill">🕒 <span>載入中…</span></div>
            <div class="miniBox" id="weatherPill">⏳ <span>天氣讀取中…</span></div>
            <div class="selectBox"><select id="sortSel"><option value="smart">排序：智慧</option><option value="title">排序：標題 A→Z</option><option value="group">排序：分類</option><option value="fav">排序：收藏優先</option></select></div>
            <button class="actionBtn" id="btnGroup" type="button">群組：開</button>
          </div>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="aside">
        <div class="contactPanel">
          <div class="eyebrow">Support</div>
          <h3>聯絡我</h3>
          <p>有網站錯誤、題庫修正、功能建議，都可以直接找我。</p>
          <div class="contactBtns">
            <a class="contactBtn" href="https://www.instagram.com/kun.chen.0826" target="_blank" rel="noopener">Instagram</a>
            <a class="contactBtn" href="https://hisausage7.github.io/" target="_blank" rel="noopener">我的網站</a>
          </div>
        </div>
        <div class="navWrap">
          <div class="navHead"><h4>分類導覽</h4></div>
          <div class="navList" id="nav"></div>
        </div>
        <div class="sideFoot">
          快捷鍵：<span class="kbd">/</span> 聚焦搜尋、<span class="kbd">Esc</span> 清空<br>
          提示：收藏固定常用。<br>
          |版權及源代碼所屬航機系008沈崑宸| |建議使用電腦版網頁|
        </div>
      </aside>

      <main class="main">
        <div class="mainTop">
          <div class="hero">
            <div>
              <h1 class="heroTitle" id="viewTitle">全部</h1>
            </div>
            <div class="statBar">
              <div class="stat"><div class="statLabel">Total</div><div class="statNum" id="statTotal">0</div></div>
              <div class="stat"><div class="statLabel">Shown</div><div class="statNum" id="statShown">0</div></div>
              <div class="stat"><div class="statLabel">Fav</div><div class="statNum" id="statFav">0</div></div>
            </div>
          </div>
        </div>
        <div class="content" id="content"></div>
